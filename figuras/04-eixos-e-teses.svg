<rect x="80" y="752" width="890" height="380" fill="none" stroke="#16A34A" stroke-width="2" rx="14"/>
<text x="110" y="792" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="24" font-weight="700" fill="#15803D">Tese por combinacao</text>
<text x="110" y="827" font-family="'Inter', 'Helvetica', sans-serif" font-size="16" fill="#6B6358">Cada combinacao (tier, modalidade) recebe UMA frase. Os 8 slides pagam essa promessa.</text>
<text x="110" y="862" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="18" font-weight="700" fill="#C64A00">FREE</text>
<text x="220" y="862" font-family="'Inter', 'Helvetica', sans-serif" font-size="18" fill="#1B1714">Feature de IA a custo zero. Margem integral na entrega.</text>
<text x="110" y="922" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="18" font-weight="700" fill="#C64A00">BARATO</text>
<text x="220" y="922" font-family="'Inter', 'Helvetica', sans-serif" font-size="18" fill="#1B1714">Centavos por milhao de tokens. Margem recorrente na diferenca.</text>
<text x="110" y="982" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="18" font-weight="700" fill="#C64A00">MEDIO</text>
<text x="220" y="982" font-family="'Inter', 'Helvetica', sans-serif" font-size="18" fill="#1B1714">Produtividade. A hora do time volta para o que vende.</text>
<text x="110" y="1042" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="18" font-weight="700" fill="#C64A00">CARO</text>
<text x="220" y="1042" font-family="'Inter', 'Helvetica', sans-serif" font-size="18" fill="#1B1714">Entrega critica com modelo de elite. Cliente paga pelo resultado.</text>
