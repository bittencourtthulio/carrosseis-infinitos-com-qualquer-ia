<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1485" width="1050" height="1485">
  <rect width="1050" height="1485" fill="#F5F1E9"/>

  <text x="80" y="100" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="20" fill="#15803D" letter-spacing="3">CAP. 01  ·  FIGURA 1</text>
  <text x="80" y="170" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="56" font-weight="700" fill="#1B1714">Dois jeitos de usar IA</text>
  <text x="80" y="215" font-family="'Inter', 'Helvetica', sans-serif" font-size="22" fill="#6B6358">O primeiro gasta em linha reta. O segundo gasta uma vez.</text>

  <!-- Coluna esquerda: JEITO 1 (ruim) -->
  <g transform="translate(80, 290)">
    <rect x="0" y="0" width="420" height="1000" fill="none" stroke="#E85D00" stroke-width="3" rx="20"/>
    <rect x="0" y="0" width="420" height="80" fill="#E85D00" rx="20"/>
    <rect x="0" y="20" width="420" height="60" fill="#E85D00"/>
    <text x="30" y="55" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">JEITO 1</text>
    <text x="30" y="75" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="14" fill="#FFFFFF" opacity="0.85">gasta por peca</text>

    <text x="30" y="140" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="24" font-weight="700" fill="#1B1714">IA escreve cada peca</text>

    <!-- passos verticais -->
    <g transform="translate(30, 180)">
      <circle cx="15" cy="15" r="15" fill="#E85D00"/>
      <text x="15" y="22" text-anchor="middle" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
      <text x="50" y="22" font-family="'Inter', 'Helvetica', sans-serif" font-size="18" fill="#1B1714">prompt para IA</text>
    </g>
    <g transform="translate(30, 230)">
      <circle cx="15" cy="15" r="15" fill="#E85D00"/>
      <text x="15" y="22" text-anchor="middle" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
      <text x="50" y="22" font-family="'Inter', 'Helvetica', sans-serif" font-size="18" fill="#1B1714">copia para Canva</text>
    </g>
    <g transform="translate(30, 280)">
      <circle cx="15" cy="15" r="15" fill="#E85D00"/>
      <text x="15" y="22" text-anchor="middle" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
      <text x="50" y="22" font-family="'Inter', 'Helvetica', sans-serif" font-size="18" fill="#1B1714">ajusta template</text>
    </g>
    <g transform="translate(30, 330)">
      <circle cx="15" cy="15" r="15" fill="#E85D00"/>
      <text x="15" y="22" text-anchor="middle" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">4</text>
      <text x="50" y="22" font-family="'Inter', 'Helvetica', sans-serif" font-size="18" fill="#1B1714">exporta PNG</text>
    </g>
    <g transform="translate(30, 380)">
      <circle cx="15" cy="15" r="15" fill="#E85D00"/>
      <text x="15" y="22" text-anchor="middle" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">5</text>
      <text x="50" y="22" font-family="'Inter', 'Helvetica', sans-serif" font-size="18" fill="#1B1714">posta no feed</text>
    </g>

    <!-- setas verticais entre passos -->
    <line x1="45" y1="215" x2="45" y2="230" stroke="#E85D00" stroke-width="2"/>
    <line x1="45" y1="265" x2="45" y2="280" stroke="#E85D00" stroke-width="2"/>
    <line x1="45" y1="315" x2="45" y2="330" stroke="#E85D00" stroke-width="2"/>
    <line x1="45" y1="365" x2="45" y2="380" stroke="#E85D00" stroke-width="2"/>

    <text x="30" y="500" font-family="'Inter', 'Helvetica', sans-serif" font-size="18" fill="#1B1714" font-style="italic">Repete para cada peca.</text>

    <!-- grafico de custo crescente -->
    <g transform="translate(30, 540)">
      <line x1="0" y1="200" x2="360" y2="200" stroke="#1B1714" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="200" stroke="#1B1714" stroke-width="2"/>
      <text x="-15" y="105" text-anchor="end" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="12" fill="#6B6358">tokens</text>
      <text x="180" y="225" text-anchor="middle" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="12" fill="#6B6358">pecas</text>
      <!-- linha crescente -->
      <polyline points="20,180 90,160 160,130 230,90 300,40" stroke="#E85D00" stroke-width="4" fill="none"/>
      <circle cx="20" cy="180" r="6" fill="#E85D00"/>
      <circle cx="90" cy="160" r="6" fill="#E85D00"/>
      <circle cx="160" cy="130" r="6" fill="#E85D00"/>
      <circle cx="230" cy="90" r="6" fill="#E85D00"/>
      <circle cx="300" cy="40" r="6" fill="#E85D00"/>
      <text x="310" y="45" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="16" font-weight="700" fill="#E85D00">cresce</text>
    </g>

    <text x="30" y="850" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="20" font-weight="700" fill="#C64A00">418 pecas = 418 sessoes de IA</text>
  </g>

  <!-- Coluna direita: JEITO 2 (bom) -->
  <g transform="translate(550, 290)">
    <rect x="0" y="0" width="420" height="1000" fill="none" stroke="#16A34A" stroke-width="3" rx="20"/>
    <rect x="0" y="0" width="420" height="80" fill="#16A34A" rx="20"/>
    <rect x="0" y="20" width="420" height="60" fill="#16A34A"/>
    <text x="30" y="55" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">JEITO 2</text>
    <text x="30" y="75" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="14" fill="#FFFFFF" opacity="0.85">gasta uma vez</text>

    <text x="30" y="140" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="24" font-weight="700" fill="#1B1714">IA escreve o sistema</text>

    <g transform="translate(30, 180)">
      <circle cx="15" cy="15" r="15" fill="#16A34A"/>
      <text x="15" y="22" text-anchor="middle" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
      <text x="50" y="22" font-family="'Inter', 'Helvetica', sans-serif" font-size="18" fill="#1B1714">IA escreve os prompts</text>
    </g>
    <g transform="translate(30, 230)">
      <circle cx="15" cy="15" r="15" fill="#16A34A"/>
      <text x="15" y="22" text-anchor="middle" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
      <text x="50" y="22" font-family="'Inter', 'Helvetica', sans-serif" font-size="18" fill="#1B1714">IA escreve o template</text>
    </g>
    <g transform="translate(30, 280)">
      <circle cx="15" cy="15" r="15" fill="#16A34A"/>
      <text x="15" y="22" text-anchor="middle" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
      <text x="50" y="22" font-family="'Inter', 'Helvetica', sans-serif" font-size="18" fill="#1B1714">IA escreve o script</text>
    </g>
    <g transform="translate(30, 330)">
      <circle cx="15" cy="15" r="15" fill="#16A34A"/>
      <text x="15" y="22" text-anchor="middle" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">4</text>
      <text x="50" y="22" font-family="'Inter', 'Helvetica', sans-serif" font-size="18" fill="#1B1714">Python gera os 418</text>
    </g>
    <g transform="translate(30, 380)">
      <circle cx="15" cy="15" r="15" fill="#16A34A"/>
      <text x="15" y="22" text-anchor="middle" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">5</text>
      <text x="50" y="22" font-family="'Inter', 'Helvetica', sans-serif" font-size="18" fill="#1B1714">posta no feed</text>
    </g>

    <line x1="45" y1="215" x2="45" y2="230" stroke="#16A34A" stroke-width="2"/>
    <line x1="45" y1="265" x2="45" y2="280" stroke="#16A34A" stroke-width="2"/>
    <line x1="45" y1="315" x2="45" y2="330" stroke="#16A34A" stroke-width="2"/>
    <line x1="45" y1="365" x2="45" y2="380" stroke="#16A34A" stroke-width="2"/>

    <text x="30" y="480" font-family="'Inter', 'Helvetica', sans-serif" font-size="18" fill="#1B1714" font-style="italic">Depois disso, Python sozinho.</text>

    <!-- grafico de custo achatado -->
    <g transform="translate(30, 540)">
      <line x1="0" y1="200" x2="360" y2="200" stroke="#1B1714" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="200" stroke="#1B1714" stroke-width="2"/>
      <text x="-15" y="105" text-anchor="end" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="12" fill="#6B6358">tokens</text>
      <text x="180" y="225" text-anchor="middle" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="12" fill="#6B6358">pecas</text>
      <!-- linha que sobe uma vez e achatada -->
      <polyline points="20,180 90,40 160,40 230,40 300,40" stroke="#16A34A" stroke-width="4" fill="none"/>
      <circle cx="20" cy="180" r="6" fill="#16A34A"/>
      <circle cx="90" cy="40" r="6" fill="#16A34A"/>
      <circle cx="160" cy="40" r="6" fill="#16A34A"/>
      <circle cx="230" cy="40" r="6" fill="#16A34A"/>
      <circle cx="300" cy="40" r="6" fill="#16A34A"/>
      <text x="310" y="45" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="16" font-weight="700" fill="#16A34A">zero</text>
    </g>

    <text x="30" y="850" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="20" font-weight="700" fill="#15803D">418 pecas = 1 sessao de IA</text>
  </g>

  <text x="525" y="1370" text-anchor="middle" font-family="'Inter', 'Helvetica', sans-serif" font-size="20" fill="#6B6358" font-style="italic">O grafico da esquerda cresce em linha reta. O da direita achatou no segundo passo.</text>
</svg>
