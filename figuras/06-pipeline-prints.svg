<text x="100" y="610" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="14" fill="#C64A00">URL 3</text>
<text x="100" y="640" font-family="'Inter', 'Helvetica', sans-serif" font-size="18" fill="#1B1714">pagina OR</text>
<rect x="390" y="290" width="290" height="60" fill="#16A34A" rx="14"/>
