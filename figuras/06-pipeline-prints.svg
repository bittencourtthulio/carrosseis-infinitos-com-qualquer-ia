<text x="80" y="170" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="56" font-weight="700" fill="#1B1714">Cadeia de URLs para captura</text>
<text x="80" y="215" font-family="'Inter', 'Helvetica', sans-serif" font-size="22" fill="#6B6358">Cada print tenta 3 URLs antes de desistir. HEAD antes de abrir a pagina.</text>
