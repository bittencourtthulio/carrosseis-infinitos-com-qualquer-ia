<text x="720" y="325" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="22" font-weight="700" fill="#15803D">Protecoes</text>
<text x="720" y="380" font-family="'Inter', 'Helvetica', sans-serif" font-size="15" fill="#1B1714">- Fonte nao carregou = aborta</text>
<text x="720" y="440" font-family="'Inter', 'Helvetica', sans-serif" font-size="15" fill="#1B1714">- Travessao na copy = aviso no log</text>
<text x="720" y="500" font-family="'Inter', 'Helvetica', sans-serif" font-size="15" fill="#1B1714">- Browser reutilizado no lote</text>
<text x="720" y="560" font-family="'Inter', 'Helvetica', sans-serif" font-size="15" fill="#1B1714">- Log com k por slide</text>
<text x="720" y="620" font-family="'Inter', 'Helvetica', sans-serif" font-size="15" fill="#1B1714">- Filtro: k abaixo de 0.85 ou aviso</text>
<text x="720" y="680" font-family="'Inter', 'Helvetica', sans-serif" font-size="15" fill="#1B1714">- Sem filtro = revisa 50 slides</text>
