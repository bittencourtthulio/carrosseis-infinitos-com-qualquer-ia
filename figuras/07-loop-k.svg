<text x="80" y="170" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="56" font-weight="700" fill="#1B1714">O loop k do renderizador</text>
<text x="80" y="215" font-family="'Inter', 'Helvetica', sans-serif" font-size="22" fill="#6B6358">O browser mede o que o codigo nao adivinha. Python ajusta em 4% por rodada.</text>
